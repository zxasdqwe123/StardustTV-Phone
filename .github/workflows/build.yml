# ============================================================
#  星尘影视（手机版）· GitHub 云编译
#  基座： FongMi/TV，固定提交 a702b20a（v4.0.4，原生手机竖屏界面）
#  放置路径： 仓库里的 .github/workflows/build.yml
# ============================================================
name: Build Stardust TV Phone

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名（留空 = 星尘影视）'
        required: false
        default: ''
      version_name:
        description: '版本名（留空 = 不改）'
        required: false
        default: ''
      version_code:
        description: '版本号整数（留空 = 不改）'
        required: false
        default: ''
      make_release:
        description: '构建后发 Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [ fongmi, main ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取源码（固定到可编译提交）
        uses: actions/checkout@v4
        with:
          ref: a702b20a5ad604a4f1706b57fda2a074fa55f7e7
          fetch-depth: 1

      - name: 2. 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. 安装 Python 3.8（Chaquopy 需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 4. 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 6. 配置签名 + 应用名 + 版本
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          cat > /tmp/ks.b64 <<'B64EOF'
          
          B64EOF
          python3 - <<'PY'
          import base64, os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          name = (os.environ.get("APP_NAME") or "星尘影视").strip()
          vn = (os.environ.get("VERSION_NAME") or "").strip()
          vc = (os.environ.get("VERSION_CODE") or "").strip()

          # 1) 写回签名证书
          (root / "app").mkdir(exist_ok=True)
          (root / "app" / "release.jks").write_bytes(base64.b64decode(pathlib.Path("/tmp/ks.b64").read_text().strip()))
          print("[diy] keystore -> app/release.jks")

          # 2) gradle.properties 注入签名参数
          gp = root / "gradle.properties"
          t = gp.read_text(encoding="utf-8")
          if "RELEASE_STORE_FILE" not in t:
              t += "\nRELEASE_STORE_FILE=release.jks\nRELEASE_STORE_PASSWORD=tvbox123456\nRELEASE_KEY_ALIAS=tvbox\nRELEASE_KEY_PASSWORD=tvbox123456\n"
              gp.write_text(t, encoding="utf-8")
              print("[diy] gradle.properties 已注入")

          # 3) app/build.gradle 注入 signingConfigs 并绑定 release
          g = root / "app/build.gradle"
          s = g.read_text(encoding="utf-8")
          if "signingConfigs" not in s:
              block = ("    signingConfigs {\n        myConfig {\n            storeFile file(RELEASE_STORE_FILE)\n"
                       "            storePassword RELEASE_STORE_PASSWORD\n            keyAlias RELEASE_KEY_ALIAS\n"
                       "            keyPassword RELEASE_KEY_PASSWORD\n            v1SigningEnabled true\n            v2SigningEnabled true\n        }\n    }\n")
              s = s.replace("android {", "android {\n" + block, 1)
              print("[diy] 已注入 signingConfigs")
          if "signingConfig signingConfigs.myConfig" not in s:
              i = s.find("buildTypes {")
              j = s.find("release {", i) if i != -1 else -1
              if j != -1:
                  k = j + len("release {")
                  s = s[:k] + "\n            signingConfig signingConfigs.myConfig" + s[k:]
                  print("[diy] 已绑定签名到 release")

          # 4) 应用名
          p = root / "app/src/main/res/values/strings.xml"
          x = p.read_text(encoding="utf-8")
          x2 = re.sub(r'(<string name="app_name">)[^<]*(</string>)', lambda m: m.group(1) + name + m.group(2), x, count=1)
          if x2 != x:
              p.write_text(x2, encoding="utf-8")
              print("[diy] 应用名 ->", name)

          # 5) 版本（留空则不改）
          if vn:
              s = re.sub(r'versionName "[^"]*"', 'versionName "%s"' % vn, s, count=1)
          if vc:
              s = re.sub(r'versionCode \d+', 'versionCode %s' % vc, s, count=1)
          g.write_text(s, encoding="utf-8")
          print("[diy] 版本:", (re.search(r'versionName "([^"]*)"', s).group(1) if re.search(r'versionName "([^"]*)"', s) else "?"),
                (re.search(r'versionCode (\d+)', s).group(1) if re.search(r'versionCode (\d+)', s) else "?"))
          PY
          rm -f /tmp/ks.b64

      - name: 7. 编译手机版 APK（arm64）
        run: |
          chmod +x gradlew
          ./gradlew assembleMobileArm64_v8aRelease --stacktrace || {
            echo "---- 可用 assemble 任务 ----"
            ./gradlew tasks --all 2>/dev/null | grep -i "^assemble" | head -20 || true
            exit 1
          }

      - name: 8. 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -lh out/

      - name: 9. 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardustPhone-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: 10. 发布 Release
        if: ${{ inputs.make_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-${{ github.run_number }}
          name: 星尘影视（手机版）build-${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: true

