# ============================================================
#  星尘影视（手机版）· GitHub 云编译
#  基座： FongMi/TV （mobile 变体 = 原生手机竖屏界面）
#  放置路径： 仓库里的 .github/workflows/build.yml
# ============================================================
name: Build Stardust TV Phone

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名（留空 = 星尘影视）'
        required: false
        default: ''
      version_name:
        description: '版本名（留空 = 不改）'
        required: false
        default: ''
      version_code:
        description: '版本号整数（留空 = 不改）'
        required: false
        default: ''
      make_release:
        description: '构建后发 Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [ fongmi, main ]
    paths:
      - '.github/workflows/**'
      - '.github/diy/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. 安装 Python 3.10（Chaquopy 需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 5. 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 6. 配置签名 + 应用名 + 版本
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          cat > /tmp/ks.b64 <<'B64EOF'
          
          B64EOF
          python3 - <<'PY'
          import base64, os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          name = (os.environ.get("APP_NAME") or "星尘影视").strip()
          vn = (os.environ.get("VERSION_NAME") or "").strip()
          vc = (os.environ.get("VERSION_CODE") or "").strip()
          # 1) 写回签名证书（放在 app/ 下，storeFile 用相对路径解析）
          (root/"app").mkdir(exist_ok=True)
          (root/"app"/"release.jks").write_bytes(base64.b64decode(pathlib.Path("/tmp/ks.b64").read_text().strip()))
          # 2) local.properties（FongMi 构建时强制读取）
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or ""
          (root/"local.properties").write_text(
          "sdk.dir=%s\nstoreFile=release.jks\nkeyAlias=tvbox\nstorePassword=tvbox123456\n" % sdk, encoding="utf-8")
          print("[diy] local.properties ->", sdk)
          # 3) 应用名
          p = root/"app/src/main/res/values/strings.xml"
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(<string name="app_name">)[^<]*(</string>)', lambda m: m.group(1)+name+m.group(2), s, count=1)
          if s2 != s:
              p.write_text(s2, encoding="utf-8"); print("[diy] 应用名 ->", name)
          # 4) 版本
          g = root/"app/build.gradle"
          t = g.read_text(encoding="utf-8")
          if vn:
              t = re.sub(r'versionName "[^"]*"', 'versionName "%s"' % vn, t, count=1)
          if vc:
              t = re.sub(r'versionCode \d+', 'versionCode %s' % vc, t, count=1)
          g.write_text(t, encoding="utf-8")
          m = re.search(r'versionName "([^"]*)"', t); n2 = re.search(r'versionCode (\d+)', t)
          # 5) compileSdk/targetSdk：API 37 尚未发布，自动回落到 36
          toml = root/"gradle/libs.versions.toml"
          if toml.exists():
              tz = toml.read_text(encoding="utf-8")
              tz2 = tz.replace('compileSdk = "37"', 'compileSdk = "36"').replace('targetSdk = "37"', 'targetSdk = "36"')
              if tz2 != tz:
                  toml.write_text(tz2, encoding="utf-8")
                  print("[diy] compileSdk/targetSdk 37 -> 36")
                  print("[diy] 新值:", [x for x in tz2.splitlines() if x.startswith(("compileSdk", "targetSdk"))])
          # 6) 补上上游遗漏的 media3 依赖（当前分支源码用了 media3 但依赖表里没有）
          MEDIA3 = ["media3-common", "media3-exoplayer", "media3-exoplayer-dash", "media3-exoplayer-hls",
                    "media3-exoplayer-rtsp", "media3-exoplayer-smoothstreaming", "media3-datasource",
                    "media3-datasource-okhttp", "media3-datasource-rtmp", "media3-extractor", "media3-container",
                    "media3-database", "media3-decoder", "media3-ui", "media3-session", "media3-effect",
                    "media3-transformer"]
          if "androidx.media3:media3-common" not in t:
              t += "\ndependencies {\n"
              for mod in MEDIA3:
                  if mod == "media3-datasource-rtmp":
                      t += '    implementation("androidx.media3:media3-datasource-rtmp:1.8.0") { exclude group: "io.antmedia" }\n'
                  else:
                      t += '    implementation "androidx.media3:%s:1.8.0"\n' % mod
              t += "}\n"
              g.write_text(t, encoding="utf-8")
              print("[diy] 已注入 media3 依赖 %d 个" % len(MEDIA3))
          print("[diy] 版本 ->", n2.group(1) if n2 else "?", m.group(1) if m else "?")
          PY
          rm -f /tmp/ks.b64

      - name: 7. 编译手机版 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleMobileRelease --build-cache --stacktrace

      - name: 8. 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -lh out/

      - name: 9. 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardustTV-Phone-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: 10. 发布 Release
        if: ${{ inputs.make_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-${{ github.run_number }}
          name: 星尘影视（手机版）build-${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: true

